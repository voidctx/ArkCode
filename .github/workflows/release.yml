name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Validate Tag Format and Pre-release Status
        id: check
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.0(-alpha|-beta)?$ ]]; then
            echo "Error: Tag '${TAG}' does not match required format (vX.Y.0, vX.Y.0-alpha, vX.Y.0-beta)."
            exit 1
          fi
          if [[ "${TAG}" =~ -(alpha|beta)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: arkcode-linux-x86_64
            use_cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: arkcode-linux-aarch64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset_name: arkcode-windows-x86_64.exe
            use_cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            asset_name: arkcode-windows-aarch6464.exe
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_name: arkcode-macos-aarch64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux Cross Stripping Tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/arkcode"
            else
              strip "target/${{ matrix.target }}/release/arkcode"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            strip "target/${{ matrix.target }}/release/arkcode"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "Windows MSVC binary stripped via rustc RUSTFLAGS strip=symbols"
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "target/${{ matrix.target }}/release/arkcode.exe" "${{ matrix.asset_name }}"
          else
            mv "target/${{ matrix.target }}/release/arkcode" "${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum arkcode-linux-x86_64 arkcode-linux-aarch64 arkcode-windows-x86_64.exe arkcode-windows-aarch6464.exe arkcode-macos-aarch64 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/arkcode-linux-x86_64
            artifacts/arkcode-linux-aarch64
            artifacts/arkcode-windows-x86_64.exe
            artifacts/arkcode-windows-aarch6464.exe
            artifacts/arkcode-macos-aarch64
            artifacts/SHA256SUMS
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
  
  publish:
    name: Dispatch Pacman Publication
    needs: [validate, build, release]
    if: >-
      needs.validate.outputs.is_prerelease != 'true' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check stable release tag format
        id: tagcheck
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Accepted stable release tag: $RELEASE_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pacman publication for tag: $RELEASE_TAG"
          fi

      - name: Dispatch package publication
        if: steps.tagcheck.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACMAN_REPO_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${SOURCE_REPO##*/}"
          PKGNAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$PKGNAME" =~ ^[a-z0-9][a-z0-9@._+-]*$ ]]; then
            echo "::error::Invalid derived package name: $PKGNAME"
            exit 1
          fi
          gh api \
            --method POST \
            "repos/voidctx/repo/dispatches" \
            -f event_type='publish-pacman-package' \
            -f "client_payload[source_repo]=$SOURCE_REPO" \
            -f "client_payload[tag]=$RELEASE_TAG" \
            -f "client_payload[name]=$PKGNAME"
          echo "Pacman publication dispatched."
